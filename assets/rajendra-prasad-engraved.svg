  <g fill="#7b6041" stroke="#5a4027" stroke-width="4"><circle cx="604" cy="1065" r="14"/><circle cx="604" cy="1145" r="14"/><circle cx="604" cy="1225" r="14"/><circle cx="604" cy="1305" r="14"/></g>
