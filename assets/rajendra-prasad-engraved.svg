  <!-- hand-sketched frame -->
  <rect x="34" y="34" width="1132" height="1432" rx="24" fill="none" stroke="#b98a2f" stroke-width="4" opacity=".6"/>
  <path d="M58 96H360M840 96H1142M58 1400H420M780 1400H1142" stroke="#e87500" stroke-width="6" opacity=".62"/>
  <path d="M58 1418H420M780 1418H1142" stroke="#164d30" stroke-width="6" opacity=".62"/>
  <circle cx="600" cy="1409" r="22" fill="none" stroke="#1f4d8f" stroke-width="5" opacity=".72"/>
  <path d="M600 1388V1430M579 1409H621M585 1394L615 1424M615 1394L585 1424" stroke="#1f4d8f" stroke-width="2.5" opacity=".72"/>

  <rect width="1200" height="1500" fill="transparent" filter="url(#grain)"/>
</svg>