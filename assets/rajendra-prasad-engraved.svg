  <g stroke="#5b4028" stroke-width="4" opacity=".34" fill="none">
    <path d="M433 472C458 435 486 414 518 400M458 454C501 421 546 408 590 407M777 472C750 435 721 414 690 401M753 454C710 421 666 408 620 407"/>
    <path d="M431 651C470 667 507 672 548 667M780 650C741 667 704 671 665 667"/>
