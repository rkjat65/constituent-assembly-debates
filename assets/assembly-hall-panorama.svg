  <!-- editorial label and tricolour baseline -->
  <g transform="translate(105 115)"><rect width="365" height="88" rx="18" fill="#fff9ed" opacity=".9" stroke="#cdb994" stroke-width="3"/><text x="26" y="36" font-family="Georgia,serif" font-size="18" letter-spacing="3" fill="#a64e00">EDITORIAL ILLUSTRATION</text><text x="26" y="66" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#2c241c">Constitution Hall · 1946</text></g>
