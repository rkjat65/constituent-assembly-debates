  <path d="M145 670C280 250 560 88 900 88C1240 88 1520 250 1655 670" fill="none" stroke="#9a7b4e" stroke-width="15" opacity=".75"/>
  <path d="M205 665C330 315 575 165 900 165C1225 165 1470 315 1595 665" fill="none" stroke="#b59a6f" stroke-width="8" opacity=".8"/>
  <path d="M365 385H1435" stroke="#b3976a" stroke-width="8" opacity=".58"/>
