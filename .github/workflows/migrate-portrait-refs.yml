name: Migrate canonical portrait references

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-portrait-refs.mjs'
      - '.github/workflows/migrate-portrait-refs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rewrite legacy portrait references
        run: node scripts/migrate-portrait-refs.mjs
      - name: Commit migrated references
        run: |
          if git diff --quiet; then
            echo 'No legacy portrait references remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '*.json' 'sessions' 'speakers' 'topics' 'data'
          git commit -m 'Migrate public portrait references to canonical generated assets'
          git pull --rebase origin main
          git push origin HEAD:main
