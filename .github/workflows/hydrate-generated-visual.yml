name: Hydrate generated Constitution Hall visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hydrate-generated-visual.yml'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download full-width generated artwork
        env:
          CANVA_IMAGE_URL: "https://document.canva.com/v2/document-image/hash:-380008202/height:1080/id:DAHSjwKfBYU/type:B/width:1920?brand=BAG3SXwF4pQ&csig=AAAAAAAAAAAAAAAAAAAAAP798aKNb0pZhGxLGHCYPUXD7CI_oEZwrX3taafMT7gl&disableexport=T&exp=1786985458&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FKfBYU%2FDAHSjwKfBYU%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHYGFFNMW3%252F20260816%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260816T172120Z%26X-Amz-Expires%3D84578%26X-Amz-Signature%3D051cf758b29a36e948304d41d246a435e51c8c8f844c3365bd9df0c4ca6353c9%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DMon%252C%252017%2520Aug%25202026%252016%253A50%253A58%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJemvLIpV6rRS4d5RFnKNCxM6MQQxg_DQXOYl5EClNv6&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$CANVA_IMAGE_URL" -o assets/constitution-hall-generated.png
          file assets/constitution-hall-generated.png
          python - <<'PY'
          from PIL import Image
          p='assets/constitution-hall-generated.png'
          im=Image.open(p)
          print('downloaded dimensions:', im.size)
          if im.width < 1500:
              raise SystemExit(f'Expected full-width artwork, got {im.size}')
          PY
      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/constitution-hall-generated.png
          git commit -m "Upgrade Constitution Hall generated artwork resolution"
          git push
