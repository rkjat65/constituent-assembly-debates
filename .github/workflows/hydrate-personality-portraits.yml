name: Hydrate archival personality portraits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hydrate-personality-portraits.yml'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download verified archival portraits
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://upload.wikimedia.org/wikipedia/commons/f/f8/Black_and_white_portrait_photograph_of_Rajendra_Prasad_presented_to_the_US.jpg' \
            -o assets/rajendra-prasad-archival.jpg
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://upload.wikimedia.org/wikipedia/commons/8/82/Dr._Babasaheb_Ambedkar_in_Mumbai%2C_1946.jpg' \
            -o assets/br-ambedkar-archival-1946.jpg
          file assets/rajendra-prasad-archival.jpg assets/br-ambedkar-archival-1946.jpg
          test -s assets/rajendra-prasad-archival.jpg
          test -s assets/br-ambedkar-archival-1946.jpg
      - name: Commit portrait assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rajendra-prasad-archival.jpg assets/br-ambedkar-archival-1946.jpg
          git commit -m 'Add archival portraits for Rajendra Prasad and Ambedkar'
          git push
